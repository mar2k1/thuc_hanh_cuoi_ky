<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
<p>Tính trung bình cộng các số nguyên chia hết cho3:</p>
<p id="showArray">Mảng: []</p>
<input type="number" id="nhapSoNguyen" placeholder="Nhập số nguyên">
<button onclick="addUnit()">Thêm</button>
<button onclick="average()">Tính</button>
<p id="result">Kết quả:</p>
<script>
    let array = [];
    function addUnit() {
        let input = document.getElementById("nhapSoNguyen");
        let value = parseInt(input.value);
        if (array.length >= 50) {
            alert("Đã đạt giới hạn tối đa");
            return;
        }
        if (isNaN(value)) {
            alert("Vui lòng nhập đúng 1 số!");
            return;
        }
        array.push(value);
        document.getElementById("showArray").innerText = "Mảng: [" + array.join(",") + "]";

    }
</script>
</body>
