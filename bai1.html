<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Câu 1</title>
</head>
<body>
<p>Tính trung bình cộng các số nguyên chia hết cho3:</p>
<p id="showArray">Mảng: []</p>
<input type="number" id="nhapSoNguyen" placeholder="Nhập số nguyên">
<button onclick="addUnit()">Thêm</button>
<button onclick="average()">Tính</button>
<p id="result">Kết quả:</p>
<script>
    let array = [];
    function addUnit() {
        let input = document.getElementById("nhapSoNguyen");
        let value = parseInt(input.value);
        if (array.length >= 50) {
            alert("Đã đạt giới hạn tối đa");
            return;
        }
        if (isNaN(value)) {
            alert("Vui lòng nhập đúng 1 số!");
            return;
        }
        array.push(value);
        document.getElementById("showArray").innerText = "Mảng: [" + array.join(",") + "]";
        input.value = "";
    }
    function average() {
        if (array.length === 0) {
            alert("Bạn chưa nhập số vào mảng");
            return;
        }
        let total = 0;
        let calculate = 0;
        for (let i = 0; i < array.length; i++) {
            if (array[i] % 3 === 0) {
                total += array[i];
                calculate++;
            }
        }
        if (calculate === 0) {
            document.getElementById("result").innerText = "Không có số nào chia hết cho 3";
        } else {
            let average = total/calculate;
            document.getElementById("result").innerText = "Trung bình cộng các số chia hết cho 3 là:" + average;
        }
    }
</script>
</body>
</html>
