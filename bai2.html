<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 2</title>
</head>
<body>
<p>Kiểm tra số hoàn hảo</p>
<input type="number" id="nhapSo" placeholder="Nhập số nguyên dương">
<button onclick="test()">Kiểm tra</button>
<p id="result">Kết quả:</p>
<script>
    function perfectNum(n) {
        if (n <= 0) {
            return false;
        }
        let total = 0;
        for (let i = 1; i < n; i++) {
            if (n % i === 0) {
                total += i;
            }
        }
        return total === n;
    }
    function test() {
        let value = parseInt(document.getElementById("nhapSo").value);
        if (isNaN(value)) {
            alert("Hãy nhập 1 số nguyên");
            return;
        }
        let result = perfectNum(value);
        document.getElementById("result").innerText = "Kết quả: " + result;
    }
</script>
</body>
</html>
