<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 4</title>
    <style>
        body {font-family: Arial; sans-serif; margin: 20px;}
        table {border-collapse: collapse; width: 80%; margin-top: 15px;}
        th, td {border: 1px solid #333; padding: 8px 12px; text-align: left;}
        th {background-color: #f2f2f2;}
        p {margin-bottom: 5px;}
    </style>
</head>
<body>
<p>Quản lý công nhân:</p>
<div id="table"></div>
<script>
    class worker {
        constructor(STT, name, birth, address, luong, position) {
            this.STT = STT;
            this.name = name;
            this.birth = birth;
            this.address = address;
            this.luong = luong;
            this.position = position;
        }
    }
    let workerList = [
        new worker(1, "Trương Tấn A", "11-11-1997", "Quảng Nam", 2000, "ABC"),
        new worker(2, "Trương Tấn B", "11-11-1997", "Huế", 2000, "ABC"),
        new worker(3, "Trương Tấn C", "11-11-1997", "Đà Nẵng", 2000, "ABC"),
    ];
    function nameSort(array) {
        return array.sort((a,b) => a.name.localeCompare(b.name), 'vi', {sensitivity: 'base'}));
    }
    function listShow() {
        nameSort(workerList);
        let html = `
            <table>
                <thead>
                <tr>
                    <th>STT</th>
                    <th>Họ tên</th>
                    <th>Ngày sinh</th>
                    <th>Địa chỉ</th>
                    <th>Lương</th>
                    <th>Chức vụ</th>
                </tr>
                </thead>
                <tbody>
        `;
        workerList.forEach((cn,index) => {
            html += `
            <tr>
                <td>${index +1}</td>
                <td>${cn.name +1}</td>
                <td>${cn.birth +1}</td>
                <td>${cn.address +1}</td>
                <td>${cn.luong +1}</td>
                <td>${cn.position +1}</td>
            </tr>
            `;
        });
        html += `
        </tbody>
        </table>
        `;
        document.getElementById("table").innerHTML = html;
    }
    listShow();
</script>
</body>
</html>
